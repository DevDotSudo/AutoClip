name: AutoClip worker

on:
  workflow_dispatch:

jobs:
  process-one-job:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out AutoClip
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Deno for YouTube extraction
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip
          python3 -m pip install --break-system-packages --upgrade yt-dlp

      - name: Install dependencies
        run: npm ci

      - name: Process one queued job
        run: npm run worker:dev
        env:
          WORKER_ONCE: "1"
          TRANSCRIPTION_PROVIDER: gemini
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YTDLP_PATH: yt-dlp
          YTDLP_JS_RUNTIME: deno
          FFMPEG_PATH: ffmpeg
          FFPROBE_PATH: ffprobe
